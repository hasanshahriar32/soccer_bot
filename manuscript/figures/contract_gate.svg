t="70"/><text x="113" y="200" font-size="21" font-weight="700" fill="#263645" text-anchor="start">2  Usable range evidence</text><text x="113" y="227" font-size="19" font-weight="400" fill="#647582" text-anchor="start">Finite accepted ranges: 0.05 &lt; r &lt; 20 m</text><use href="#fusion" x="24" y="267" width="70" height="70"/><text x="113" y="289" font-size="21" font-weight="700" fill="#263645" text-anchor="start">3  Metric target payload</text><text x="113" y="316" font-size="18.5" font-weight="400" fill="#647582" text-anchor="start">Finite target, absence or unobserved state</text><polyline points="520,124 574,124 574,361" fill="none" stroke="#008b91" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow008b91)"/><polyline points="520,213 574,213 574,361" fill="none" stroke="#008b91" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow008b91)"/><polyline points="520,302 574,302 574,361" fill="none" stroke="#008b91" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow008b91)"/><use href="#gate" x="537" y="361" width="70" height="70"/><text x="574" y="455" font-size="19" font-weight="400" fill="#008b91" text-anchor="middle">Pass / zero</text><text x="20" y="379" font-size="18.5" font-weight="400" fill="#647582" text-anchor="start">Near-range stop is retained from the source.</text><text x="20" y="407" font-size="18.5" font-weight="400" fill="#a84b45" text-anchor="start">A fresh invalid payload fails usability.</text><text x="20" y="435" font-size="18.5" font-weight="400" fill="#647582" text-anchor="start">Receipt age does not measure capture age.</text></g></svg>
