und" marker-end="url(#arrow9aaab6)"/><text x="200" y="184" font-size="18.5" font-weight="400" fill="#16858d" text-anchor="middle">hold</text><text x="400" y="78" font-size="19" font-weight="400" fill="#253748" text-anchor="middle">at_pick_zone</text><polyline points="357,155 443,155" fill="none" stroke="#9aaab6" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow9aaab6)"/><text x="400" y="184" font-size="18.5" font-weight="400" fill="#16858d" text-anchor="middle">stop_base</text><text x="600" y="78" font-size="19" font-weight="400" fill="#253748" text-anchor="middle">stopped + reachable</text><text x="600" y="101" font-size="19" font-weight="400" fill="#627483" text-anchor="middle">target</text><polyline points="557,155 643,155" fill="none" stroke="#9aaab6" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow9aaab6)"/><text x="600" y="184" font-size="18.5" font-weight="400" fill="#16858d" text-anchor="middle">reach</text><text x="800" y="78" font-size="19" font-weight="400" fill="#253748" text-anchor="middle">grip_confirmed</text><polyline points="757,155 843,155" fill="none" stroke="#9aaab6" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow9aaab6)"/><text x="800" y="184" font-size="18.5" font-weight="400" fill="#16858d" text-anchor="middle">stow_arm</text><text x="1000" y="78" font-size="19" font-weight="400" fill="#253748" text-anchor="middle">at_drop_zone</text><polyline points="957,155 1043,155" fill="none" stroke="#9aaab6" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow9aaab6)"/><text x="1000" y="184" font-size="18.5" font-weight="400" fill="#16858d" text-anchor="middle">stop_base</text><text x="1200" y="78" font-size="19" font-weight="400" fill="#253748" text-anchor="middle">release_confirmed</text><polyline points="1157,155 1243,155" fill="none" stroke="#9aaab6" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow9aaab6)"/><text x="1200" y="184" font-size="18.5" font-weight="400" fill="#16858d" text-anchor="middle">hold</text><use href="#hazbot-camera" x="64" y="108" width="86" height="86"/><use href="#hazbot-object" x="112" y="150" width="48" height="48"/><use href="#hazbot-drive" x="266" y="110" width="88" height="88"/><use href="#hazbot-drive" x="466" y="113" width="82" height="82"/><polyline points="553,145 553,178 571,178" fill="none" stroke="#9aaab6" stroke-width="2.4" stroke-linejoin="round"/><use href="#hazbot-arm" x="665" y="108" width="92" height="92"/><use href="#hazbot-drive" x="865" y="114" width="88" height="88"/><use href="#hazbot-object" x="888" y="110" width="44" height="44"/><use href="#hazbot-arm" x="1058" y="110" width="88" height="88"/><use href="#hazbot-container" x="1113" y="148" width="54" height="54"/><use href="#hazbot-container" x="1262" y="109" width="96" height="96"/><polyline points="1293,154 1306,168 1337,134" fill="none" stroke="#16858d" stroke-width="4.5" stroke-linejoin="round"/><text x="110" y="237" font-size="21.5" font-weight="700" fill="#34799c" text-anchor="middle">SEARCH</text><text x="110" y="268" font-size="19.5" font-weight="400" fill="#253748" text-anchor="middle">rotate / hold</text><text x="310" y="237" font-size="21.5" font-weight="700" fill="#34799c" text-anchor="middle">APPROACH</text><text x="310" y="268" font-size="19.5" font-weight="400" fill="#253748" text-anchor="middle">advance</text><text x="510" y="237" font-size="21.5" font-weight="700" fill="#16858d" text-anchor="middle">DOCK</text><text x="510" y="268" font-size="19.5" font-weight="400" fill="#253748" text-anchor="middle">verify handoff</text><text x="710" y="237" font-size="21.5" font-weight="700" fill="#16858d" text-anchor="middle">GRASP</text><text x="710" y="268" font-size="19.5" font-weight="400" fill="#253748" text-anchor="middle">close_gripper</text><text x="910" y="237" font-size="21.5" font-weight="700" fill="#a87935" text-anchor="middle">CARRY</text><text x="910" y="268" font-size="19.5" font-weight="400" fill="#253748" text-anchor="middle">transport</text><text x="1110" y="237" font-size="21.5" font-weight="700" fill="#a87935" text-anchor="middle">PLACE</text><text x="1110" y="268" font-size="19.5" font-weight="400" fill="#253748" text-anchor="middle">open_gripper</text><text x="1310" y="237" font-size="21.5" font-weight="700" fill="#16858d" text-anchor="middle">COMPLETE</text><text x="1310" y="268" font-size="19.5" font-weight="400" fill="#253748" text-anchor="middle">hold</text><polyline points="22,290 1398,290" fill="none" stroke="#dce5eb" stroke-width="1.4" stroke-linejoin="round"/><text x="22" y="320" font-size="19.5" font-weight="700" fill="#253748" text-anchor="start">Motion interlock:</text><text x="196" y="320" font-size="19.5" font-weight="400" fill="#627483" text-anchor="start">base motion requires arm_stowed; arm actions require base_stopped.</text><rect x="22" y="342" width="67" height="25" rx="3" fill="#fbf3e5" stroke="#d7c49f" stroke-width="1.5"/><text x="55.5" y="362" font-size="18.5" font-weight="700" fill="#a87935" text-anchor="middle">HOLD</text><text x="105" y="362" font-size="19.5" font-weight="400" fill="#627483" text-anchor="start">Blocked guards keep the phase; hold is abstract inhibition, not verified physical stopping.</text></g></svg>
