<svg xmlns="http://www.w3.org/2000/svg" width="7.1in" height="1.9in" viewBox="0 0 1420 380" role="img" aria-labelledby="title desc"><title id="title">Reference mission transition guards, actions and base-arm handoffs</title><desc id="desc">Abstract reference model for nonhazardous surrogate evaluation, separate from runtime integration. Above-link text shows selected transition prerequisites; below-link text shows commands. At the pick zone APPROACH issues stop_base and enters DOCK. A stopped base plus fresh authorized reachable target and usable fresh scan permit reach and GRASP. GRASP closes the gripper until grip_confirmed; transition to CARRY issues stow_arm. CARRY transport cannot begin until arm_stowed, and at the drop zone it issues stop_base. PLACE opens the gripper under its full prerequisites; release confirmation reaches absorbing COMPLETE with hold. HOLD inhibits commands abstractly and can accompany acquisition/completion handoffs; blocked guards preserve the phase. It is not physical stopping or contact sensing.</desc><defs><symbol id="hazbot-pi" viewBox="0 0 128 128"><g stroke="#253748" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
