Central edge computer</text><use href="#hazbot-pi" x="589" y="192" width="242" height="242"/><text x="710" y="457" font-size="21" font-weight="700" fill="#253748" text-anchor="middle">Native vision / ML</text><text x="710" y="486" font-size="20" font-weight="400" fill="#253748" text-anchor="middle">Range association</text><text x="710" y="514" font-size="20" font-weight="400" fill="#253748" text-anchor="middle">Navigation / mission I/O</text><text x="710" y="542" font-size="19" font-weight="400" fill="#627483" text-anchor="middle">ROS 2 + serial interfaces</text><rect x="25" y="71" width="31" height="31" rx="3" fill="#34799c" stroke="none" stroke-width="1.5"/><text x="40.5" y="93" font-size="20" font-weight="700" fill="white" text-anchor="middle">01</text><text x="70" y="93" font-size="23" font-weight="700" fill="#34799c" text-anchor="start">VISION &amp; ONBOARD ML</text><use href="#hazbot-camera" x="59" y="126" width="171" height="171"/><text x="146" y="325" font-size="22" font-weight="700" fill="#253748" text-anchor="middle">Pi Camera V2</text><polyline points="215,202 528,202 528,290 609,290" fill="none" stroke="#34799c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow34799c)"/><text x="362" y="188" font-size="20" font-weight="400" fill="#34799c" text-anchor="middle">Direct CSI ribbon</text><text x="358" y="260" font-size="20" font-weight="400" fill="#253748" text-anchor="middle">RGB image stream</text><text x="358" y="293" font-size="20" font-weight="400" fill="#253748" text-anchor="middle">Inference runs on Pi</text><text x="257" y="324" font-size="19" font-weight="400" fill="#627483" text-anchor="start">INT8 detector · local TFLite</text><text x="25" y="369" font-size="19" font-weight="400" fill="#627483" text-anchor="start">Task-class output → candidate target</text><rect x="948" y="71" width="31" height="31" rx="3" fill="#16858d" stroke="none" stroke-width="1.5"/><text x="963.5" y="93" font-size="20" font-weight="700" fill="white" text-anchor="middle">02</text><text x="993" y="93" font-size="23" font-weight="700" fill="#16858d" text-anchor="start">RANGING &amp; NAVIGATION</text><use href="#hazbot-controller" x="956" y="125" width="108" height="108"/><use href="#hazbot-lidar" x="1196" y="121" width="164" height="164"/><polyline points="1208,203 1066,203" fill="none" stroke="#16858d" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow16858d)"/><text x="1136" y="183" font-size="19" font-weight="400" fill="#16858d" text-anchor="middle">Scan packets</text><text x="1011" y="287" font-size="21" font-weight="700" fill="#253748" text-anchor="middle">Sensor controller</text><text x="1011" y="315" font-size="19" font-weight="400" fill="#627483" text-anchor="middle">Built-in ranging MCU</text><text x="1278" y="326" font-size="22" font-weight="700" fill="#253748" text-anchor="middle">YDLidar X4</text><polyline points="962,213 909,213 909,286 813,286" fill="none" stroke="#16858d" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow16858d)"/><text x="920" y="255" font-size="19" font-weight="400" fill="#16858d" text-anchor="start">USB serial</text><text x="948" y="369" font-size="19" font-weight="400" fill="#627483" text-anchor="start">2-D ranges → clearance + target distance</text><rect x="25" y="415" width="31" height="31" rx="3" fill="#a87935" stroke="none" stroke-width="1.5"/><text x="40.5" y="437" font-size="20" font-weight="700" fill="white" text-anchor="middle">03</text><text x="70" y="437" font-size="23" font-weight="700" fill="#a87935" text-anchor="start">WHEEL DRIVE</text><use href="#hazbot-arduino" x="67" y="500" width="110" height="110"/><use href="#hazbot-driver" x="254" y="500" width="110" height="110"/><use href="#hazbot-drive" x="433" y="496" width="115" height="115"/><polyline points="612,388 537,388 537,475 123,475 123,512" fill="none" stroke="#a87935" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrowa87935)"/><text x="344" y="463" font-size="19" font-weight