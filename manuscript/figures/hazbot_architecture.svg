<svg xmlns="http://www.w3.org/2000/svg" width="7.1in" height="3.6in" viewBox="0 0 1420 720" role="img" aria-labelledby="title desc"><title id="title">HazBot Pi-centred architecture with four robot subsystems</title><desc id="desc">Raspberry Pi is the central compute device. Camera V2 connects through CSI and vision/ML executes natively on Pi. YDLidar X4 communicates through its built-in controller and USB-UART interface; navigation runs on Pi. A dedicated drive Arduino at 9600 baud controls L298N and DC wheels; a separate arm Arduino at 115200 baud controls base, shoulder, elbow and gripper servo channels. Current learned detector classes are tennis and cricket balls. This is a source-grounded system schematic, not proof of autonomous hazardous-material handling.</desc><defs><symbol id="hazbot-pi" viewBox="0 0 128 128"><g stroke="#253748" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
