slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Frame & Transform settings
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.5
    resolution: 0.05
    restamp_tf: true
    min_laser_range: 0.1
    max_laser_range: 20.0
    minimum_time_interval: 0.05
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Pure LiDAR Scan-Matching Odometry (No Encoders Needed)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 50
    scan_buffer_maximum_scan_distance: 20.0
    link_match_minimum_response_fine: 0.05
    link_scan_maximum_distance: 2.5
    loop_search_maximum_distance: 6.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.3
    loop_match_minimum_response_fine: 0.4

    # Correlation Parameters (Expanded Search Space for Pure Scan Matching)
    correlation_search_space_dimension: 1.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Variance Penalties (0.0 allows pure laser odometry without encoder drift penalties)
    distance_variance_penalty: 0.0
    angle_variance_penalty: 0.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.5
    coarse_angle_resolution: 0.02
    minimum_angle_penalty: 0.0
    minimum_distance_penalty: 0.0
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
